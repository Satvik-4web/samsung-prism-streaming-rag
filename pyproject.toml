[project]
name = "prism-streaming-rag"
version = "0.1.0"
description = "Streaming Live RAG Engine (Theme 4)"
authors = [
    {name = "Antigravity", email = "antigravity@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rank_bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
disable_error_code = ["syntax"]

[tool.setuptools]
packages = ['backend']
